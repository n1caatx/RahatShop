spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rahatshop}
    username: ${SPRING_DATASOURCE_USERNAME:rahatshop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:2345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${BACKEND_PORT:8080}

jwt:
  secret: ${JWT_SECRET:rahatshop-dev-secret-key-change-in-production}
  expirationMs: 86400000
  refreshExpirationMs: 604800000

logging:
  level:
    root: INFO
    com.rahatshop: DEBUG
    org.springframework.security: INFO
