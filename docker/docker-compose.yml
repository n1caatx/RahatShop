version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rahatshop-postgres
    environment:
      POSTGRES_DB: rahatshop
      POSTGRES_USER: rahatshop_user
      POSTGRES_PASSWORD: 2345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rahatshop_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rahatshop-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rahatshop
      SPRING_DATASOURCE_USERNAME: rahatshop_user
      SPRING_DATASOURCE_PASSWORD: 2345
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: rahatshop-dev-secret-key-change-in-production
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rahatshop-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
