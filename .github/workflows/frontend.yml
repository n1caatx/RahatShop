name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: Node.js quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Lint yoxla
        run: npm run lint

      - name: Testləri işlət
        run: npm test -- --ci --maxWorkers=2

      - name: Layihəni build et
        run: npm run build
